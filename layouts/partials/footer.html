<footer class="td-footer monitoring-footer d-print-none">
  <div class="monitoring-footer__inner">
    <div class="monitoring-footer__links">
      {{ range .Site.Params.links.user }}
      <a href="{{ .url }}" title="{{ .desc }}"><i class="{{ .icon }}" aria-hidden="true"></i><span>{{ .name }}</span></a>
      {{ end }}
    </div>
    <nav class="monitoring-footer__navigation" aria-label="Footer">
      <a href="{{ "legal-notice/" | relURL }}">Legal notice</a>
    </nav>
    <span class="monitoring-footer__copyright">&copy; {{ now.Year }} {{ .Site.Params.copyright }}</span>
  </div>
</footer>
