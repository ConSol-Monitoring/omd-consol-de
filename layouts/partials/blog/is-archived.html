{{- $archived := false -}}
{{- if and .IsPage (eq .Section "blog") -}}
  {{- if isset .Params "archived" -}}
    {{- $archived = eq .Params.archived true -}}
  {{- else -}}
    {{- $archived = .Date.Before (time.AsTime .Site.Params.blog_archive_before) -}}
  {{- end -}}
{{- end -}}
{{- return $archived -}}
