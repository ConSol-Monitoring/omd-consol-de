{{/* Keep the TOC container available for ScrollSpy, even when empty. */}}
<div class="td-toc" data-proofer-ignore>
{{ if not .Params.notoc -}}
  {{ $toc := .TableOfContents -}}
  {{ if and $toc (ne $toc `<nav id="TableOfContents"></nav>`) -}}
    <div class="td-toc-title">
      <span class="td-toc-title__text">{{ i18n "toc_on_this_page" }}</span>
      <a class="td-toc-title__link" href="#" title="{{ i18n "toc_top_of_page" }}">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3 2h10M8 14V5m-4 4 4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Back to top</span>
      </a>
    </div>
    {{ $toc | safeHTML }}
  {{ end -}}
{{ end -}}
</div>
