name: citest

on:
  push:

jobs:
  citest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: preparetest tests
        run: |
          make preparetest

      - name: verify theme installation in git-sync checkout
        run: |
          docker run --rm --entrypoint /bin/sh \
            -v "$PWD:/src:ro" consol/omd-consol-de \
            /src/scripts/test-install-theme-deps.sh

      - name: run tests
        run: |
          make test

      - name: cleanup
        run: |
          make clean
